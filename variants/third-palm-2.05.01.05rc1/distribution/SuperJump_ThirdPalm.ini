; Super Jump Third Palm 2.05.01.04rc1
; The ASI reads this dedicated INI beside the loaded SuperJump_ThirdPalm.asi.
; Save in-game edits and allow up to one second for the next boost to use them.
; BoostY controls the vertical movement applied during each boost frame.
; Applies to Kliff's third downward Force Palm and Damiane and Oongka's double jump.
; Allowed range: 0.1 to 120.0. 40.0 is the RC3 default.

[SuperJump]
BoostY=40.0
